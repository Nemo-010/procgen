name: update-corpus

on:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch upstreams
        run: |
          mkdir -p upstream
          git clone --depth 1 https://github.com/svenstaro/genact upstream/genact
          git clone --depth 1 https://github.com/CH563/fakeact upstream/fakeact

      - name: Verify the extractor
        run: python -m unittest discover -s tests

      - name: Extract
        id: run
        run: |
          python -m actparse \
            --repo upstream/genact \
            --repo upstream/fakeact \
            --out extracted | tee run.log
          echo "rejected=$(grep -c 'kept-prior' run.log || true)" >> "$GITHUB_OUTPUT"

      - name: Commit if the corpus changed
        run: |
          rm -rf upstream run.log
          git config user.name "actparse"
          git config user.email "actparse@users.noreply.github.com"
          if [ -z "$(git status --porcelain extracted)" ]; then
            echo "no change"
            exit 0
          fi
          git add extracted
          git commit -m "chore: refresh extracted corpus"
          git push
